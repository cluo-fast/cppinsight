[package]
name = "cppinsight-ai"
version = "0.1.0"
description = "CppInsight AI desktop workbench"
authors = ["CppInsight AI"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "cppinsight_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cppinsight-ai"
path = "src/main.rs"

[[bin]]
name = "cppinsight-workbench"
path = "src/bin/workbench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "4.1", features = ["v1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
