name: Windows desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: Import the configured certificate and sign Windows bundles
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Build and test scanner
        shell: pwsh
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --config Release
          ctest --test-dir build-release -C Release --output-on-failure
          New-Item -ItemType Directory -Force desktop/src-tauri/resources | Out-Null
          Copy-Item build-release/Release/cppinsight.exe desktop/src-tauri/resources/cppinsight.exe -Force

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify release configuration and frontend
        working-directory: desktop
        run: |
          pnpm run verify:release
          pnpm run build

      - name: Test Rust backend
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Import Windows signing certificate
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE is required for a signed build"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for a signed build"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "cppinsight-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item $certificatePath -Force

          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $signingConfig | ConvertTo-Json -Depth 4 | Set-Content `
            desktop/src-tauri/tauri.windows-signing.conf.json

      - name: Build NSIS and MSI bundles
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (Test-Path src-tauri/tauri.windows-signing.conf.json) {
            pnpm tauri build --config src-tauri/tauri.windows-signing.conf.json
          } else {
            pnpm tauri build
          }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name.EndsWith("-setup.exe") }
          if ($installers.Count -lt 2) {
            throw "Expected both MSI and NSIS installers"
          }
          $checksums = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($bundleRoot, $installer.FullName)
            "$hash  $relative"
          }
          $checksums | Set-Content "$bundleRoot/SHA256SUMS.txt"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cppinsight-windows-${{ inputs.sign && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
