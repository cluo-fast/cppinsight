name: Windows desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: Import the configured certificate and sign Windows bundles
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Build and test scanner
        shell: pwsh
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --config Release
          ctest --test-dir build-release -C Release --output-on-failure
          New-Item -ItemType Directory -Force desktop/src-tauri/resources | Out-Null
          Copy-Item build-release/Release/cppinsight.exe desktop/src-tauri/resources/cppinsight.exe -Force

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify release configuration and frontend
        working-directory: desktop
        run: |
          pnpm run verify:bundle
          pnpm run build
          pnpm run test:graph-snapshot
          pnpm run test:report-html
          pnpm run test:artifact-manifest
          pnpm run test:benchmark-result
          pnpm run test:benchmark-corpus

      - name: Test Rust backend
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Test MCP transport
        working-directory: tools/mcp-server
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Reject signing from untrusted refs
        if: github.event_name == 'workflow_dispatch' && inputs.sign && github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "Signed builds may only run from refs/heads/main"

      - name: Import Windows signing certificate
        if: github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE is required for a signed build"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for a signed build"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "cppinsight-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item $certificatePath -Force
          "CPPINSIGHT_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $signingConfig | ConvertTo-Json -Depth 4 | Set-Content `
            desktop/src-tauri/tauri.windows-signing.conf.json

      - name: Build NSIS and MSI bundles
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path src-tauri/tauri.windows-signing.conf.json) {
            pnpm tauri build --config src-tauri/tauri.windows-signing.conf.json
          } else {
            pnpm tauri build
          }

      - name: Verify bundled sample scan and graph query
        shell: pwsh
        run: |
          $scanPath = Join-Path $env:RUNNER_TEMP "cppinsight-sample-scan.json"
          & build-release/Release/cppinsight.exe scan examples/sample-cpp --json $scanPath --quiet
          if ($LASTEXITCODE -ne 0) { throw "Bundled sample scan failed" }
          & desktop/src-tauri/target/release/cppinsight-workbench.exe index $scanPath --db examples/sample-cpp/.cppinsight/index.sqlite
          if ($LASTEXITCODE -ne 0) { throw "Bundled sample index write failed" }
          $request = @'
          {"protocol_version":1,"project_id":0,"graph_kind":"function_calls","root_node_ids":[],"direction":"both","depth":2,"filters":{},"max_nodes":500,"path_target":null,"continuation":null}
          '@
          $responseText = $request | & desktop/src-tauri/target/release/cppinsight-workbench.exe graph --root examples/sample-cpp --request -
          if ($LASTEXITCODE -ne 0) { throw "Bundled sample graph query failed" }
          $response = $responseText | ConvertFrom-Json
          if ($response.protocol_version -ne 1 -or $response.statistics.returned_node_count -lt 1) {
            throw "Bundled sample graph response was empty or invalid"
          }

      - name: Verify bundled sample graph benchmark
        shell: pwsh
        run: |
          $benchmarkPath = Join-Path $env:RUNNER_TEMP "cppinsight-sample-benchmark.json"
          ./scripts/benchmark-graph.ps1 `
            -ProjectRoot examples/sample-cpp `
            -WorkbenchPath desktop/src-tauri/target/release/cppinsight-workbench.exe `
            -Iterations 3 `
            -OutputPath $benchmarkPath
          node scripts/verify-benchmark-result.mjs $benchmarkPath

      - name: Verify Authenticode signatures
        if: github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name.EndsWith("-setup.exe") }
          if ($installers.Count -lt 2) {
            throw "Expected both MSI and NSIS installers before signature verification"
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:CPPINSIGHT_SIGNING_THUMBPRINT) {
              throw "Unexpected signer certificate on $($installer.Name)"
            }
          }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name.EndsWith("-setup.exe") }
          if ($installers.Count -lt 2) {
            throw "Expected both MSI and NSIS installers"
          }
          $checksums = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($bundleRoot, $installer.FullName)
            "$hash  $relative"
          }
          $checksums | Set-Content "$bundleRoot/SHA256SUMS.txt"
          node scripts/verify-sha256-manifest.mjs "$bundleRoot/SHA256SUMS.txt"

      - name: Smoke test MSI and NSIS installers
        shell: pwsh
        run: |
          ./scripts/windows-installer-smoke.ps1 `
            -BundleRoot desktop/src-tauri/target/release/bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cppinsight-windows-${{ inputs.sign && github.ref == 'refs/heads/main' && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
