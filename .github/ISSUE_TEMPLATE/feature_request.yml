name: Feature request
description: Suggest an improvement to scanning, graphs, the desktop app, CLI, or MCP. 建议改进扫描、关系图、桌面、CLI 或 MCP。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please do not paste customer source, indexes, API keys, real project paths, or chat transcripts.
        感谢建议。请不要粘贴客户源码、索引、API Key、真实项目路径或聊天内容。
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard today when onboarding or reading a C/C++ project? 接手或阅读 C/C++ 项目时，现在哪里不好用？
      placeholder: I cannot tell which call edges came from the compilation database.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how would you check that it worked? 希望怎么改，怎样算做好了？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: 相关部分
      options:
        - Scanner / 扫描器
        - Graphs / 关系图
        - Impact analysis / 影响面
        - Desktop / 桌面
        - CLI or MCP
        - Docs / 文档
        - Other / 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I confirm this request does not include source code, an API key, a customer path, or chat content. 我确认没有包含源码、API Key、客户路径或聊天内容。
          required: true
